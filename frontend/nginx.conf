# Configuración de nginx para servir la app React.
server {
    listen 80;
    server_name _;

    # Peso máximo de lo que se sube. Un poco más que los 20 MB que valida el
    # backend (apps/common/archivos.py), para que el mensaje claro lo dé Django y
    # no este corte genérico. Sin esta línea, nginx corta en 1 MB.
    client_max_body_size 25m;
    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANTE: para que el router de React funcione, cualquier ruta que no
    # sea un archivo real debe devolver index.html (y React decide qué mostrar).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas a /api/ se reenvían al backend.
    # (El nombre "backend" lo resuelve docker-compose; en producción se ajusta.)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
