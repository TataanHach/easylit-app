name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migraciones y checks
        working-directory: backend
        env: { DJANGO_SETTINGS_MODULE: config.settings.dev }
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
      # Pruebas automáticas (login, invitaciones, límites de intentos, aislamiento
      # entre organizaciones, archivos, IA y generación). Sin clave de Gemini: las
      # pruebas usan el modo simulado y nunca llaman a servicios externos.
      - name: Pruebas automáticas
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          GEMINI_API_KEY: ""
        run: python manage.py test --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # «npm run build» revisa los tipos de TypeScript (tsc) antes de compilar.
      - name: Revisar tipos y compilar
        working-directory: frontend
        run: |
          npm ci
          npm run build
