# =============================================================
# EasyLit · Prueba de despliegue en Render (Blueprint)
#
#   Render       easylit-api    Web Service: Django (Gunicorn) + Celery juntos
#                easylit-redis  Key Value:   cola de tareas de Celery
#                easylit-web    Static Site: React compilado
#                easylit-db     PostgreSQL:  datos (plan gratis: VENCE A LOS 30 DÍAS)
#   Cloudflare   R2             → archivos subidos y documentos generados
#   Firebase     Authentication → inicio de sesión
#
# Las variables con sync:false se pegan a mano en el panel de Render (son
# secretas o dependen de tus cuentas). Guía paso a paso: DESPLIEGUE.md
# =============================================================

databases:
  # ---- PostgreSQL ----
  # Plan gratis: vence 30 días después de crearla; luego hay ~14 días para pasarla
  # a un plan de pago o se borra con todos sus datos. Ver DESPLIEGUE.md.
  - name: easylit-db
    plan: free
    region: oregon
    databaseName: easylit
    user: easylit
    # Acceso externo (con contraseña y SSL) para crear el primer usuario desde tu PC
    # (el plan gratis no tiene Shell). Después puedes cerrarlo en el panel: Networking.
    ipAllowList:
      - source: 0.0.0.0/0
        description: todos

services:
  # ---- Redis (cola de tareas) ----
  - type: keyvalue
    name: easylit-redis
    plan: free
    region: oregon
    ipAllowList: []        # solo accesible desde dentro de Render

  # ---- Backend: API + worker en un solo servicio ----
  - type: web
    name: easylit-api
    runtime: python
    plan: free             # se duerme tras 15 min sin uso; el primer acceso tarda ~1 min
    region: oregon
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.13.17"            # misma versión que en local; parches hasta 2029
      - key: SECRET_KEY
        generateValue: true          # Render genera un secreto fuerte
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: easylit-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: easylit-db
          property: connectionString
      # URL pública de easylit-web, para CORS (https://easylit-web.onrender.com)
      - key: FRONTEND_URL
        sync: false
      # Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: IA_MODEL
        value: models/gemini-3.5-flash-lite
      # Cloudflare R2
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false                  # https://<id-de-cuenta>.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENCIALES
        sync: false                  # JSON completo de la cuenta de servicio

  # ---- Frontend React ----
  - type: web
    name: easylit-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      # Versión de Node para compilar (Node 20 ya no tiene soporte desde abril de 2026).
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false                   # https://easylit-api.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      # SPA: cualquier ruta desconocida cae en index.html (React Router)
      - type: rewrite
        source: "/*"
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
